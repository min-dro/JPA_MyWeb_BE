spring.application.name=JPA_MyWeb_BE

server.servlet.context-path=/myweb
server.port=8006

# 요청 Entry Point 는 http://localhost:8006/myweb

# 기존 Oracle 을 MySQL 로 마이그레이션 하기
# 1. pom.xml 에 MySQL Driver 라이브러리 추가
# 2. application.properties 에 접속 정보 셋팅

# DB 접속정보 셋팅 - 오라클 연동 구문
# spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
# spring.datasource.username=FULLSTACK
# spring.datasource.password=FULLSTACK

# DB 접속정보 셋팅 - MySQL 연동 구문
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/fullstack
# 내 로컬 컴퓨터의 3306 (mysql 의 기본 포트번호) 의 practice 라는 스키마에 접속하겠다.
spring.datasource.username=root
spring.datasource.password=mysql
# RDS 를 처음부터 EC2 서버와 연결해서 생성했기 떄문에 이 개발용 컴퓨터 (외부 컴퓨터) 에서는 접속 불가!!
# 그리고 빌드 시에는 내부적으로 Maven 이 Test 후 문제가 없다면 그제서야 빌드 파일 (jar) 을 만들어주는 구조임
# 그러다보니 DB 접속정보를 RDS 의 엔드포인트 정보로 두면 Test 단계에서 막히고, 빌드도 안되는 상황이 발생!!
# jar 파일은 어떻게든 만들어 내야하기 때문에 기존 개발용 DB 접속정보로 그대로 두고 빌드할 것임!!

# 기존 MyBatis 를 JPA 로 마이그레이션 하기
# 1. pom.xml 에 JPA 라이브러리 추가
# 2. application.properties 에 JPA 관련 설정 추가

# MyBatis 연동 셋팅
# mybatis.config-location=classpath:mybatis-config.xml
# mybatis.mapper-locations=classpath:mappers/*.xml

spring.jpa.hibernate.ddl-auto=update
# update 로 두는 이유는 내가 직접 ddl 구문을 이용해서 DB 테이블 구축을 할 것이기 때문!!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 파일업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB